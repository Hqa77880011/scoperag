[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scoperag"
version = "0.1.0"
description = "ScopeRAG implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "torch>=2.3,<3", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2", "transformers>=4.51,<5", "accelerate>=1.0,<2", "sentencepiece>=0.2,<1", "sentence-transformers>=3.0,<6", "PyMuPDF>=1.24,<2", "datasets>=3,<5"]

[project.scripts]
scoperag = "scoperag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/Hqa77880011/scoperag"
